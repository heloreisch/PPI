<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


        <style>
                .container{
                    display: flex
                    ;
                }

                .inputs{
                    display:flex ;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                }
                
                .form{

                }

        </style>




</head>
<body>
    


    <div class="container">
        <div  class="form"></div>
        <div class="inputs">
            <label for="min">mnimo</label>
            <input type="number" id="min"></input>
            </div> 
                    <div class="inputs">
            <label for="max">maximo</label>
            <input type="number" id="max"></input>

        </div>
        </div>
        <button id="bntsortear">SORTEAR</button>
            <h2 id="result">-</h2>
    </div>
        <script>
        bntsortear.addEventListener("click", () => {

                minimo=Number.parseFloat(min.value);
                maximo=Number.parseFloat(max.value);
                random = (Math.random()*(maximo-minimo))+minimo // retona ne 0 e 1
                result.innerHTML= random
            } );
        </script>

</body>
</html>
