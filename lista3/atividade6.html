<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
        }

        .container {
            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns: 1fr 0.7fr 1fr;
            grid-template-rows: 1fr 1fr 0.7fr;

            gap: 3px;
            padding: 3px;

            background-color: white;
        }

        .item1 {
            background-color: orange;
            grid-column: 1;
            grid-row: 1;
        }

        .item2 {
            background-color: aquamarine;
            grid-column: 1;
            grid-row: 2;
        }

        .item3 {
            background-color: #f5ad2d;
            grid-column: 1 / 3;
            grid-row: 3;
        }

        .item4 {
            background-color: #f3a1da;
            grid-column: 2;
            grid-row: 1 / 3;
        }

        .item5 {
            background-color: #7bf0f0;
            grid-column: 3;
            grid-row: 1;
        }

        .item6 {
            background-color: #c9f51a;
            grid-column: 3;
            grid-row: 2 / 4;
        }

        .bolinhas {
            grid-column: 3;
            grid-row: 3 / 5;

            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;

            padding-right: 10px;
        }

        .bolinha {
            width: 25px;
            height: 25px;
            border-radius: 50%;
        }

        .bolinha:nth-child(1) {
            background-color: #f85b01;
        }

        .bolinha:nth-child(2) {
            background-color: #f80202;
        }

        .bolinha:nth-child(3) {
            background-color: #01f522;
        }

        .bolinha:nth-child(4) {
            background-color: #6401fa;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>

        <div class="bolinhas">
            <div class="bolinha"></div>
            <div class="bolinha"></div>
            <div class="bolinha"></div>
            <div class="bolinha"></div>
        </div>

    </div>

</body>
</html>
