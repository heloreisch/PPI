<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 72px;
            background-color: #7bbe0f;
            padding: 8px;
        }

        main {
            flex: 1;
            display: flex;
        }

        article {
            flex: 1;
            padding: 15px 8px;
            background-color: white;
        }

        aside {
            width: 120px;
            padding: 15px 12px;
            background-color: #dde4d1;
        }

        nav {
            width: 103px;
            padding: 15px 5px;
            background-color: #abe2e4;
        }

        footer {
            height: 65px;
            background-color: #82ff0c;
            padding: 15px 8px;
        }
    </style>
</head>

<body>

    <header>Header</header>

    <main>
        <article>
            <p>Article</p>
        </article>
        <aside>
            <p>Aside</p>
        </aside>
        <nav>
            <p>Nav</p>
        </nav>
    </main>

    <footer>
        </p>Footer</p>
    </footer>

</body>

</html>
