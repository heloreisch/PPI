<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            border: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            height: 100vh;
        }

        header, footer {
            padding: 1em;
            height: 10%;
            align-content: center;
            background-color: #60a000;
        }

        main{
            display:flex;
            height: 80%;
        }

        article {
            padding:1em;
            align-content: center;
            width: 70%;
            background-color: #fff;
        }

        aside {
            padding:1em;
            align-content: center;
            width: 15%;
            background-color: #d1e7b0;
        }

        nav {
            padding:1em;
            align-content: center;
            width: 15%;
            background-color: #b4d386;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <p>Header</p>
        </header>
        <main>
        <article>
            <p>Article</p>
        </article>
        <aside>
            <p>Aside</p>
        </aside>
        <nav>
            <p>Nav</p>
        </nav>
    </main>
        <footer>
            <p>Footer</p>
        </footer>
    </div>
</body>

</html>
