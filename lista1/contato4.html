<!--Crie um formulário de contato com os seguintes campos, é evidente que ainda não encaminharemos para nenhum servidor, preocupe-se apenas e construir os campos do formulário usando a tag form e inputs, selects e options de entrada adequadamente.:
Nome (obrigatório)
E-mail (obrigatório, tipo email)
Assunto
Estado  (tag Option)
Mensagem
Botão de envio
O formulário deve:
Utilizar tag label para cada campo e um atributo id para cada elemento de entrada de dados como input
Ter validação básica via HTML (campo numérico e-mail) (required)
Incluir placeholder nos campos
Inclua uma mensagem no topo da página com instruções para o usuário.
Adicione um link de navegação que volte para o 3_curriculo.html.
-->



<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>

<body>
    <style>
          body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        .formulario {

            background-color: white;
            max-width: 900px;
            margin: auto;
            padding: 80px;
            
        }
        input, .combobox, #mensagem{
             width: 100%;
             height: 42px;

            padding: 0 12px;

            border: 1px solid #d5d5d5;
            border-radius: 6px;

            font-size: 14px;

            outline: none;
                }
            </style>
    
    <form class="formulario">

        <h1>Formulário de Contato</h1>
        <label for="nome">Nome:</label>
        <input  type="text" id="nome"  name="nome"
            placeholder="Digite seu nome" required>
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email"  id="email"  name="email"
            placeholder="Digite seu e-mail"required>

        <br><br>

        <label for="assunto">Assunto:</label>
        <input  type="text"  id="assunto"  name="assunto"
         placeholder="Digite o assunto">

        <br><br>
      
        <label for="estado">Estado:</label>
        <select id="estado" name="estado" class="combobox">
            <option value="">Selecione seu estado</option>
            <option value="SC">Santa Catarina</option>
            <option value="PR">Paraná</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="BA">Bahia</option>
            <option value="PE">Pernambuco</option>
            <option value="PR">Paraná</option>
            <option value="GO">Goiás</option>
        </select>
        

        <br><br>

        <label for="mensagem">Mensagem:</label>
        <br>
        <textarea 
            id="mensagem" name="mensagem"
            placeholder="Digite sua mensagem" rows="5" cols="40"
        ></textarea>

        <br><br>
        <button type="submit">Enviar</button>

         <p>
        Preencha os campos abaixo para entrar em contato.
        Os campos marcados como obrigatórios precisam ser preenchidos.
    </p>
    <a href="atividade4.html">Voltar para o currículo</a>
    <br><br>

    </form>

</body>
</html>
