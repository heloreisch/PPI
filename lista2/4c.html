Arquivo: 4a-display-.html  4b-display-.html  e 4c-display-.html--> 
 
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>4c - Position</title>


     <style>


        .box{
            display: inline-block;
            width: 100px;   
            height: 100px;
        }
                #box1{
                    background-color:blueviolet; /* o box1 vai ser exibido no canto inferior (bottom)  e a esquerda (left)*/
                    position: fixed; /* fixed p levar o layout da tela se fosse relative relative = permanece one ele ta ate dar uma ordem */
                    bottom: 0px; /* 0 p fica encostado na origem (bottom) */
                    left: 0px;

                }
                #box2{
                    background-color: green; /* o box2 vai ser exibido no canto inferior (bottom)  e a direita (right)*/
                    position: fixed;
                    bottom: 0px;
                    right: 0px;
                }
                  #box3{
                    background-color: red;/* o box3 vai ser exibido no canto superior (top)  e a esquerda (left)*/
                    position: fixed;
                    top: 0px;
                    left: 0px;
                }
                 #box4{ /* o box4 vai ser exibido no canto superior (top)  e a direita (rigth)*/
                    background-color: yellow;
                    position: fixed;
                    top: 0px;
                    right: 0px;
                }
                 #box5{
                    background-color: magenta;/* o box5 vai ser exibido no  meio da tela*/
                    position: fixed; 
                    top: 50%; /*topo para no 50 ou seja top 50 bottom 50 = meio*/
                    right: 50%;/*mesma ideia */
                    transform: translate(-50% ,-50%); /*puxa o próprio elemento metade da sua largura para a esquerda e metade da sua altura para cima*/
                }



    </style>
</head>
    
    <body>
    
    <!-- div.container>div#box$.box{box$}*5 -->
 <div class="container">
    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">box2</div>
    <div id="box3" class="box">box3</div>
    <div id="box4" class="box">box4</div>
    <div id="box5" class="box">box5</div>
 </div>
  </body>
 </html>
