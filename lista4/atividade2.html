<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Layout</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 24% 76%;
            grid-template-rows: 18% 64% 18%;
        }

        header {
            grid-column: 1 / 3;
            background-color: #e52b7d;
            display: flex;
            justify-content: center;
            font-size: 20px;
        }

        nav {
            grid-column: 1;
            grid-row: 2;
            background-color: #d0ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        main {
            grid-column: 2;
            grid-row: 2;
            background-color: #fd7105;
            padding: 10px 26px;
           
        }

        main h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 6px;
        }

        footer {
            grid-column: 1 / 3;
            background-color: #20c795;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

    </style>
</head>

<body>

    <header>
        <p>Header</p>
    </header>

    <nav>
       <p> Nav</p>
    </nav>

    <main>
        <h2>Content</h2>
    </main>

    <footer>
        <p>Footer</p>
    </footer>

</body>

</html>
