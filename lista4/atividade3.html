<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 28% 72%;
            grid-template-rows: 35% 65%;
            gap: 7px;
            background-color: white;
        }

        div {
            background-color: #444;
            color: white;
            padding: 10px;
            font-size: 18px;
            border-radius: 2px;
        }


        .A {
            grid-column: 1;
            grid-row: 1;
            width: 50%;
        }


        .B {
            grid-column: 2;
            grid-row: 1;
            width: 50%;
            justify-self: end;
        }


        .C {
            grid-column: 1;
            grid-row: 2;
        }


        .direita {
            grid-column: 2;
            grid-row: 2;
            padding: 13px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 7px;
            background-color: #424040;
        }

        .direita div {
            background-color: #ccc;
            color: #424040;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="A">A</div>

    <div class="B">B</div>

    <div class="C">C</div>

    <div class="direita">
        <div>E</div>
        <div>F</div>
        <div>G</div>
        <div>M</div>
        <div>I</div>
        <div>J</div>
    </div>

</body>

</html>
